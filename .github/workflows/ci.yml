name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  # The Flutter version this package is validated against. Bump deliberately,
  # re-running the full local validation from AGENTS.md.
  FLUTTER_VERSION: "3.38.7"

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter test
        working-directory: example
      - run: flutter pub publish --dry-run

  build-android-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug
        working-directory: example

  # The only place the Swift plugin is compiled; non-Mac dev machines cannot.
  build-ios-example:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --debug --no-codesign
        working-directory: example
