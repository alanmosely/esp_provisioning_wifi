name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  # The Flutter version this package is validated against. Bump deliberately,
  # re-running the full local validation from AGENTS.md.
  FLUTTER_VERSION: "3.38.7"

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/integration_test
      - run: flutter analyze
      - run: flutter test
      - run: flutter test
        working-directory: example
      - run: flutter pub publish --dry-run

  minimum-flutter-consumer:
    name: Flutter 3.24 consumer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/fixtures/flutter_3_24_consumer
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true
      # Resolve the plugin as a dependency so only the consumer needs to
      # support Flutter 3.24, independently of the plugin's contributor tools.
      - run: flutter pub get
      - run: flutter test --no-pub

  build-android-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug
        working-directory: example
      # Native unit tests for the plugin's Kotlin invariants (resolver
      # exactly-once/main-thread, Boss token/cancel/credit semantics). The
      # gradle wrapper only exists after the Flutter build above generates it.
      - run: ./gradlew :esp_provisioning_wifi:testDebugUnitTest :esp_provisioning_wifi:lintDebug
        working-directory: example/android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provisioning-example-android
          path: example/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          compression-level: 0

  # The only place the Swift plugin is compiled; non-Mac dev machines cannot.
  build-ios-example:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: swift test --package-path ios
      - run: flutter build ios --debug --no-codesign
        working-directory: example
      - name: Bundle unsigned iOS example
        run: |
          mkdir -p .release
          ditto -c -k --keepParent example/build/ios/iphoneos/Runner.app .release/provisioning-example-ios-unsigned.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provisioning-example-ios-unsigned
          path: .release/provisioning-example-ios-unsigned.zip
          if-no-files-found: error
          compression-level: 0
